<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Marca: tile azul con la Z. El SVG lo usan los navegadores modernos; el PNG y el .ico
         son respaldo (Safari viejo, Windows), y el apple-touch-icon es para "Agregar a inicio"
         en iPhone. La Z del SVG es TRAZO, no texto: se ve igual sin la fuente SF Pro. -->
    <!-- ⚠️ El `?v=` NO es decorativo: los navegadores guardan el favicon en un caché
         aparte que ni un refresh forzado limpia, así que al cambiar la marca la
         pestaña seguía enseñando la vieja. Cambiar el número obliga a pedirlo de
         nuevo. Si algún día se rediseña el ícono, SUBIR ESTE NÚMERO. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fuentes SIN bloquear el primer pintado: con rel=stylesheet normal, en el
         celular ni la pantalla de carga salía hasta que respondía Google. Se
         cargan como "print" y al llegar pasan a "all"; la pantalla de carga
         (src/lib/carga.js) espera a document.fonts.ready antes de irse. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=3" />
    <link rel="icon" href="/favicon.ico?v=3" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <!-- SEO -->
    <title>KaiZen · Marca, redes, web y software a la medida</title>
    <meta
      name="description"
      content="Estudio de marca, redes sociales y software a la medida: identidad de marca, community management, sitios web, tiendas en línea, punto de venta, apps y automatización con IA."
    />
    <meta name="author" content="KaiZen" />

    <!-- Open Graph (vista previa al compartir en WhatsApp / redes) -->
    <!-- Dominio propio: kaizenstudiomx.com (desde 2026-10-05; conectado al proyecto de
         Pages "zahirportafolio", que sigue respondiendo en zahirportafolio.pages.dev).
         Van en URL ABSOLUTA a propósito: varias apps no resuelven rutas relativas.
         ⚠️ WhatsApp CACHEA la vista previa por URL. Si cambias el diseño de la imagen,
         renómbrala (og-image-v4.jpg…) o seguirá enseñando la vieja durante días. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="KaiZen" />
    <meta property="og:url" content="https://kaizenstudiomx.com/" />
    <meta property="og:title" content="Evoluciona la forma en que haces negocio" />
    <meta
      property="og:description"
      content="Marca, redes sociales, sitios web, apps y software a la medida para tu negocio. Proyectos reales, ya en producción."
    />
    <meta property="og:image" content="https://kaizenstudiomx.com/og-image-v4.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="KaiZen — evoluciona la forma en que haces negocio."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Evoluciona la forma en que haces negocio" />
    <meta
      name="twitter:description"
      content="Marca, redes sociales, sitios web, apps y software a la medida para tu negocio. Proyectos reales, ya en producción."
    />
    <meta name="twitter:image" content="https://kaizenstudiomx.com/og-image-v4.jpg" />

    <!-- Anti-parpadeo: fija el tema en el <html> ANTES de pintar. Sin esto, la
         página aparece un instante en oscuro y luego salta a claro. Debe ir en
         el <head> y ser síncrono (nada de defer/module). -->
    <script>
      (function () {
        var t;
        try {
          t = localStorage.getItem('tema');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'light') {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#ffffff');
        }
        // PANTALLA DE CARGA: al abrir solo se ven las partículas; la nube
        // (src/lib/nube.js) quita 'intro' cuando ya armó ΚΛΙΖΣΝ. Siempre se
        // empieza arriba (sin restaurar el scroll). No aplica si se llega con
        // #ancla, con reduced-motion ni fuera de la portada. Respaldo: se quita sola a los 13 s por si
        // el 3D no carga.
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        // Solo en la portada: las páginas legales no tienen nube que la quite.
        var portada = location.pathname === '/' || location.pathname === '/index.html';
        if (!reduce && !location.hash && portada) {
          if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
          document.documentElement.classList.add('intro');
          // Bloquear el scroll SIN tocar overflow: en Safari, alternar el
          // overflow de <html>/<body> deja de pegar los position:sticky (el
          // escenario del hero se iba hacia arriba). Se ignoran rueda, touch y
          // teclas mientras dure 'intro'; en captura, antes que Lenis.
          var root = document.documentElement;
          var teclas = { ' ': 1, PageDown: 1, PageUp: 1, ArrowDown: 1, ArrowUp: 1, Home: 1, End: 1 };
          var bloquea = function (e) {
            if (!root.classList.contains('intro')) return;
            if (e.type === 'keydown' && !teclas[e.key]) return;
            e.preventDefault();
            e.stopPropagation();
          };
          ['wheel', 'touchmove', 'keydown'].forEach(function (tipo) {
            window.addEventListener(tipo, bloquea, { passive: false, capture: true });
          });
          // (la pantalla de carga se va a más tardar a los 9 s y la intro dura ~3 s)
          setTimeout(function () {
            document.documentElement.classList.remove('intro');
          }, 13000);
        }
      })();
    </script>
    <style>
      body {
        background-color: #000000;
        color: #f5f5f7;
        margin: 0;
      }
      html[data-theme='light'] body {
        background-color: #ffffff;
        color: #1d1d1f;
      }
      /* PANTALLA DE CARGA (src/lib/carga.js la quita cuando el 3D y las fuentes
         están listos). Va aquí, en línea, para que se vea desde el primer
         instante, antes de que baje cualquier JavaScript. */
      #carga {
        display: none;
      }
      html.intro #carga {
        --tinta: #ece8df;
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #000;
        color: var(--tinta);
        transition: opacity 0.8s ease, visibility 0.8s;
      }
      html[data-theme='light'].intro #carga {
        --tinta: #1d1d1f;
        background: #fff;
      }
      #carga.is-fuera {
        opacity: 0;
        visibility: hidden;
      }
      /* El logo se dibuja y Kai (el guía) ya está encaramado en su esquina: es
         un Kai de CSS, en el mismo lugar donde luego aparece el de verdad. */
      #carga .carga-marca {
        position: relative;
        width: min(62vw, 340px);
      }
      #carga svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      #carga path {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        /* se dibuja UNA vez, letra por letra, y se queda (antes se dibujaba y se borraba en bucle) */
        animation: carga-trazo 1.1s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      #carga path:nth-child(2) { animation-delay: 0.14s; }
      #carga path:nth-child(3) { animation-delay: 0.28s; }
      #carga path:nth-child(4) { animation-delay: 0.42s; }
      #carga path:nth-child(5) { animation-delay: 0.56s; }
      #carga path:nth-child(6) { animation-delay: 0.7s; }
      #carga .carga-kai {
        position: absolute;
        right: -30px;
        top: -52px;
        width: 60px;
        height: 60px;
        animation: carga-flota 2.4s ease-in-out infinite;
      }
      /* Kai con su aspecto FINAL (ya no evoluciona): la perla de cromo con su aro.
         El aro va en dos mitades: la de atrás (::before) y la de enfrente (::after). */
      #carga .carga-kai::before,
      #carga .carga-kai::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 58px;
        height: 20px;
        margin: -10px -29px;
        border-radius: 50%;
        border: 2px solid var(--tinta);
        opacity: 0.85;
        transform: rotate(-16deg);
      }
      #carga .carga-kai::before { clip-path: inset(0 0 50% 0); opacity: 0.4; }
      #carga .carga-kai::after { clip-path: inset(50% 0 0 0); }
      /* la perla, con su visor y sus dos ojos de luz */
      #carga .carga-kai i {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 42px;
        height: 42px;
        margin: -21px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 24%, #fff 0 7%, #b9b9b9 20%, #4a4a4a 52%, #151515 100%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28);
      }
      #carga .carga-kai b {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 27px;
        height: 15px;
        margin: -10px -13.5px;
        border-radius: 8px;
        background: #000;
      }
      #carga .carga-kai b::before,
      #carga .carga-kai b::after {
        content: '';
        position: absolute;
        top: 4px;
        width: 3px;
        height: 7px;
        border-radius: 2px;
        background: #f6f2e8;
        animation: carga-parpadea 3.2s infinite;
      }
      #carga .carga-kai b::before { left: 8px; }
      #carga .carga-kai b::after { right: 8px; }
      #carga .carga-riel {
        width: 120px;
        height: 1px;
        background: color-mix(in srgb, var(--tinta) 18%, transparent);
        overflow: hidden;
      }
      #carga .carga-riel i {
        display: block;
        height: 100%;
        background: var(--tinta);
        transform-origin: left;
        transform: scaleX(calc(0.08 + 0.92 * var(--p, 0)));
        transition: transform 0.6s ease;
      }
      @keyframes carga-trazo { to { stroke-dashoffset: 0; } }
      @keyframes carga-flota { 50% { transform: translateY(-5px); } }
      @keyframes carga-parpadea { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.15); } }
    </style>
  </head>
  <body>
    <div id="carga" aria-hidden="true">
      <div class="carga-marca">
        <!-- ΚΛΙΖΣΝ: el mismo trazo de KaizenWordmark.jsx -->
        <svg viewBox="-8 -10 498 120" fill="none" stroke="currentColor" stroke-width="15" stroke-linejoin="miter">
          <path pathLength="1" d="M7 0V100 M66 0 12 54 M30 37 70 100" />
          <path pathLength="1" d="M92 100 132 6 172 100" />
          <path pathLength="1" d="M201 0V100" />
          <path pathLength="1" d="M230 7H300L230 93H300" />
          <path pathLength="1" d="M388 7H322L360 50 322 93H388" />
          <path pathLength="1" d="M417 100V7L473 93V0" />
        </svg>
        <div class="carga-kai"><i></i><b></b></div>
      </div>
      <div class="carga-riel"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Marca: tile azul con la Z. El SVG lo usan los navegadores modernos; el PNG y el .ico
         son respaldo (Safari viejo, Windows), y el apple-touch-icon es para "Agregar a inicio"
         en iPhone. La Z del SVG es TRAZO, no texto: se ve igual sin la fuente SF Pro. -->
    <!-- ⚠️ El `?v=` NO es decorativo: los navegadores guardan el favicon en un caché
         aparte que ni un refresh forzado limpia, así que al cambiar la marca la
         pestaña seguía enseñando la vieja. Cambiar el número obliga a pedirlo de
         nuevo. Si algún día se rediseña el ícono, SUBIR ESTE NÚMERO. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <!-- SEO -->
    <title>Zahir Vidahurrázaga · Apps, sitios web y software a la medida</title>
    <meta
      name="description"
      content="Construyo apps móviles, sitios web, e-commerce, puntos de venta y automatización a la medida para tu negocio — del software al hardware, listos para producción."
    />
    <meta name="author" content="Zahir Daniel Vidahurrázaga Marín" />

    <!-- Open Graph (vista previa al compartir en WhatsApp / redes) -->
    <!-- ⚠️ Al conectar dominio propio: cambiar el dominio en og:url, og:image y twitter:image.
         Van en URL ABSOLUTA a propósito: varias apps no resuelven rutas relativas.
         ⚠️ WhatsApp CACHEA la vista previa por URL. Si cambias el diseño de la imagen,
         renómbrala (og-image-v3.jpg…) o seguirá enseñando la vieja durante días. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="Zahir Vidahurrázaga" />
    <meta property="og:url" content="https://zahirportafolio.pages.dev/" />
    <meta property="og:title" content="Software a tu medida: que se adapte a ti, no tú a él." />
    <meta
      property="og:description"
      content="Apps móviles, sitios web, e-commerce, POS y automatización a la medida para tu negocio. Soluciones reales, ya en producción."
    />
    <meta property="og:image" content="https://zahirportafolio.pages.dev/og-image-v2.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Zahir Vidahurrázaga — software a tu medida: que se adapte a ti, no tú a él."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Software a tu medida: que se adapte a ti, no tú a él." />
    <meta
      name="twitter:description"
      content="Apps, sitios web, e-commerce, POS y automatización a la medida para tu negocio. Soluciones reales, ya en producción."
    />
    <meta name="twitter:image" content="https://zahirportafolio.pages.dev/og-image-v2.jpg" />

    <!-- Anti-parpadeo: fija el tema en el <html> ANTES de pintar. Sin esto, la
         página aparece un instante en oscuro y luego salta a claro. Debe ir en
         el <head> y ser síncrono (nada de defer/module). -->
    <script>
      (function () {
        var t;
        try {
          t = localStorage.getItem('tema');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'light') {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#ffffff');
        }
      })();
    </script>
    <style>
      body {
        background-color: #000000;
        color: #f5f5f7;
        margin: 0;
      }
      html[data-theme='light'] body {
        background-color: #ffffff;
        color: #1d1d1f;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

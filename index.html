<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Marca: tile azul con la Z. El SVG lo usan los navegadores modernos; el PNG y el .ico
         son respaldo (Safari viejo, Windows), y el apple-touch-icon es para "Agregar a inicio"
         en iPhone. La Z del SVG es TRAZO, no texto: se ve igual sin la fuente SF Pro. -->
    <!-- ⚠️ El `?v=` NO es decorativo: los navegadores guardan el favicon en un caché
         aparte que ni un refresh forzado limpia, así que al cambiar la marca la
         pestaña seguía enseñando la vieja. Cambiar el número obliga a pedirlo de
         nuevo. Si algún día se rediseña el ícono, SUBIR ESTE NÚMERO. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fuentes SIN bloquear el primer pintado: con rel=stylesheet normal, en el
         celular ni la pantalla de carga salía hasta que respondía Google. Se
         cargan como "print" y al llegar pasan a "all"; la pantalla de carga
         (src/lib/carga.js) espera a document.fonts.ready antes de irse. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=3" />
    <link rel="icon" href="/favicon.ico?v=3" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <!-- SEO -->
    <title>KaiZen · Marca, redes, web y software a la medida</title>
    <meta
      name="description"
      content="Estudio de marca, redes sociales y software a la medida: identidad de marca, community management, sitios web, tiendas en línea, punto de venta, apps y automatización con IA."
    />
    <meta name="author" content="KaiZen" />

    <!-- Open Graph (vista previa al compartir en WhatsApp / redes) -->
    <!-- Dominio propio: kaizenstudiomx.com (desde 2026-10-05; conectado al proyecto de
         Pages "zahirportafolio", que sigue respondiendo en zahirportafolio.pages.dev).
         Van en URL ABSOLUTA a propósito: varias apps no resuelven rutas relativas.
         ⚠️ WhatsApp CACHEA la vista previa por URL. Si cambias el diseño de la imagen,
         renómbrala (og-image-v4.jpg…) o seguirá enseñando la vieja durante días. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="KaiZen" />
    <meta property="og:url" content="https://kaizenstudiomx.com/" />
    <meta property="og:title" content="Evoluciona la forma en que haces negocio" />
    <meta
      property="og:description"
      content="Marca, redes sociales, sitios web, apps y software a la medida para tu negocio. Proyectos reales, ya en producción."
    />
    <meta property="og:image" content="https://kaizenstudiomx.com/og-image-v4.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="KaiZen — evoluciona la forma en que haces negocio."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Evoluciona la forma en que haces negocio" />
    <meta
      name="twitter:description"
      content="Marca, redes sociales, sitios web, apps y software a la medida para tu negocio. Proyectos reales, ya en producción."
    />
    <meta name="twitter:image" content="https://kaizenstudiomx.com/og-image-v4.jpg" />

    <!-- Anti-parpadeo: fija el tema en el <html> ANTES de pintar. Sin esto, la
         página aparece un instante en oscuro y luego salta a claro. Debe ir en
         el <head> y ser síncrono (nada de defer/module). -->
    <script>
      (function () {
        var t;
        try {
          t = localStorage.getItem('tema');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'light') {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#ffffff');
        }
        // PANTALLA DE CARGA: al abrir solo se ven las partículas; la nube
        // (src/lib/nube.js) quita 'intro' cuando ya armó ΚΛΙΖΣΝ. Siempre se
        // empieza arriba (sin restaurar el scroll). No aplica si se llega con
        // #ancla, con reduced-motion ni fuera de la portada. Respaldo: se quita sola a los 13 s por si
        // el 3D no carga.
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        // Solo en la portada: las páginas legales no tienen nube que la quite.
        var portada = location.pathname === '/' || location.pathname === '/index.html';
        if (!reduce && !location.hash && portada) {
          if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
          document.documentElement.classList.add('intro');
          // Bloquear el scroll SIN tocar overflow: en Safari, alternar el
          // overflow de <html>/<body> deja de pegar los position:sticky (el
          // escenario del hero se iba hacia arriba). Se ignoran rueda, touch y
          // teclas mientras dure 'intro'; en captura, antes que Lenis.
          var root = document.documentElement;
          var teclas = { ' ': 1, PageDown: 1, PageUp: 1, ArrowDown: 1, ArrowUp: 1, Home: 1, End: 1 };
          var bloquea = function (e) {
            if (!root.classList.contains('intro')) return;
            if (e.type === 'keydown' && !teclas[e.key]) return;
            e.preventDefault();
            e.stopPropagation();
          };
          ['wheel', 'touchmove', 'keydown'].forEach(function (tipo) {
            window.addEventListener(tipo, bloquea, { passive: false, capture: true });
          });
          // (la pantalla de carga se va a más tardar a los 9 s y la intro dura ~3 s)
          setTimeout(function () {
            document.documentElement.classList.remove('intro');
          }, 13000);
        }
      })();
    </script>
    <style>
      body {
        background-color: #000000;
        color: #f5f5f7;
        margin: 0;
      }
      html[data-theme='light'] body {
        background-color: #ffffff;
        color: #1d1d1f;
      }
      /* PANTALLA DE CARGA (src/lib/carga.js la quita cuando el 3D y las fuentes
         están listos). Va aquí, en línea, para que se vea desde el primer
         instante, antes de que baje cualquier JavaScript. */
      #carga {
        display: none;
      }
      html.intro #carga {
        --tinta: #ece8df;
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #000;
        color: var(--tinta);
        transition: opacity 0.8s ease, visibility 0.8s;
      }
      html[data-theme='light'].intro #carga {
        --tinta: #1d1d1f;
        background: #fff;
      }
      #carga.is-fuera {
        opacity: 0;
        visibility: hidden;
      }
      #carga svg {
        width: 54px;
        height: 54px;
      }
      #carga path {
        stroke-dasharray: 160;
        stroke-dashoffset: 160;
        animation: carga-trazo 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      #carga .carga-riel {
        width: 120px;
        height: 1px;
        background: color-mix(in srgb, var(--tinta) 18%, transparent);
        overflow: hidden;
      }
      #carga .carga-riel i {
        display: block;
        height: 100%;
        background: var(--tinta);
        transform-origin: left;
        transform: scaleX(calc(0.08 + 0.92 * var(--p, 0)));
        transition: transform 0.6s ease;
      }
      @keyframes carga-trazo {
        0% { stroke-dashoffset: 160; }
        45%, 60% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -160; }
      }
    </style>
  </head>
  <body>
    <div id="carga" aria-hidden="true">
      <svg viewBox="20 20 60 60" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="miter">
        <path d="M33 27V73 M66 27 38 52 M48 44 68 73" />
      </svg>
      <div class="carga-riel"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

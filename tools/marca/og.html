<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- Plantilla de la imagen que sale al compartir el link (WhatsApp, redes).
         Se fotografía con og.mjs, que sustituye __AVATAR__ por el recorte de la cara.

         Va en OSCURO a propósito: el sitio tiene los dos temas, pero contra la
         burbuja verde clara de WhatsApp la versión oscura destaca más.
         Esto NO afecta al tema del sitio, es un JPG aparte. -->
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif; }

      .og { width: 1200px; height: 630px; position: relative; overflow: hidden; background: #05070d; }

      /* Los mismos glows viajeros del hero del sitio */
      .og::before, .og::after { content: ''; position: absolute; border-radius: 50%; filter: blur(120px); }
      .og::before { width: 720px; height: 720px; left: -230px; top: -260px; background: rgba(10,132,255,0.55); }
      .og::after { width: 660px; height: 660px; right: -180px; bottom: -300px; background: rgba(150,80,242,0.45); }

      .capa {
        position: relative; z-index: 2; height: 100%; padding: 62px 64px;
        display: flex; flex-direction: column; justify-content: center;
      }

      /* Identidad: la cara chica hace de firma, no de protagonista */
      .persona { display: flex; align-items: center; gap: 24px; }
      .redonda {
        width: 118px; height: 118px; border-radius: 50%; overflow: hidden; flex: none;
        border: 3px solid rgba(255, 255, 255, 0.85);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.5);
      }
      .redonda img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .firma { font-size: 31px; font-weight: 700; color: #fff; letter-spacing: -0.01em; }
      .servicios { font-size: 20px; color: rgba(255, 255, 255, 0.62); margin-top: 7px; font-weight: 500; }

      /* Ritmo AGRUPADO, no huecos iguales: 46px separan la identidad del mensaje,
         y solo 26px separan el mensaje de sus pruebas, que le pertenecen. */
      .titular {
        margin-top: 46px;
        font-size: 56px; font-weight: 700; line-height: 1.07; letter-spacing: -0.025em; color: #fff;
      }
      .titular .az { color: #4da3ff; }

      .proof { margin-top: 26px; display: flex; gap: 12px; }
      .chip {
        font-size: 18px; font-weight: 600; color: rgba(255, 255, 255, 0.9);
        background: rgba(255, 255, 255, 0.11); border: 1px solid rgba(255, 255, 255, 0.16);
        padding: 11px 20px; border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="og" id="og">
      <div class="capa">
        <div class="persona">
          <div class="redonda"><img src="__AVATAR__" /></div>
          <div>
            <div class="firma">Zahir Vidahurrázaga</div>
            <div class="servicios">Apps · Sitios web · E-commerce · POS · Automatización</div>
          </div>
        </div>
        <div class="titular">
          Software a tu medida.<br />Que se adapte a ti, <span class="az">no tú a él.</span>
        </div>
        <div class="proof">
          <div class="chip">En App Store y Google Play</div>
          <div class="chip">Negocios reales en producción</div>
        </div>
      </div>
    </div>
  </body>
</html>
